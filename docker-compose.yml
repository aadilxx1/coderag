services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coderag
      POSTGRES_PASSWORD: coderag
      POSTGRES_DB: coderag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag"]
      interval: 5s
      retries: 10

volumes:
  pgdata: